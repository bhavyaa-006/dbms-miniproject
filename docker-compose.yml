version: '3.9'

services:
  # ── FastAPI Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laf_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:bhavya@host.docker.internal:5432/lostAndFound
      SECRET_KEY: campus-lost-found-super-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    volumes:
      - uploads_data:/app/uploads   # persist uploaded images across restarts
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── React Frontend (nginx) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: laf_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

# ── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  uploads_data:     # uploaded images persist across container restarts
