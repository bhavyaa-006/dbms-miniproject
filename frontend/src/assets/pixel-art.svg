<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect width="128" height="128" fill="transparent"/>
  <!-- white pixel flower (simple pixel-art) -->
  <!-- center -->
  <g fill="#FFD166">
    <rect x="56" y="56" width="16" height="16"/>
  </g>
  <!-- petals (white) -->
  <g fill="#FFFFFF">
    <rect x="56" y="36" width="16" height="16"/>
    <rect x="56" y="76" width="16" height="16"/>
    <rect x="36" y="56" width="16" height="16"/>
    <rect x="76" y="56" width="16" height="16"/>
    <rect x="40" y="40" width="16" height="16"/>
    <rect x="72" y="40" width="16" height="16"/>
    <rect x="40" y="72" width="16" height="16"/>
    <rect x="72" y="72" width="16" height="16"/>
  </g>
</svg>
