<svg xmlns="http://www.w3.org/2000/svg" width="440" height="120" viewBox="0 0 440 120" preserveAspectRatio="xMidYMid meet">
  <rect width="440" height="120" fill="transparent"/>
  <!-- halftone eye inspired pixel art (green tones, subtle opacity) -->
  <g fill="rgba(21,128,61,0.14)">
    <!-- background halftone dots -->
    <!-- row blocks -->
    <rect x="0" y="0" width="440" height="120" fill="transparent"/>
  </g>
  <!-- darker green shapes to form an eye silhouette -->
  <g fill="rgba(34,139,34,0.22)">
    <rect x="24" y="20" width="392" height="16"/>
    <rect x="56" y="36" width="328" height="14"/>
    <rect x="88" y="50" width="264" height="12"/>
    <rect x="112" y="62" width="216" height="10"/>
  </g>
  <!-- pupil and highlight (darker center) -->
  <g fill="rgba(0,0,0,0.6)">
    <rect x="196" y="38" width="48" height="24"/>
    <rect x="204" y="44" width="32" height="12"/>
  </g>
  <!-- lighter green halftone details -->
  <g fill="rgba(124,92,255,0.06)">
    <rect x="28" y="28" width="12" height="12"/>
    <rect x="44" y="26" width="10" height="10"/>
    <rect x="60" y="24" width="8" height="8"/>
    <rect x="76" y="24" width="6" height="6"/>
    <rect x="360" y="30" width="10" height="10"/>
    <rect x="340" y="32" width="8" height="8"/>
  </g>
</svg>
